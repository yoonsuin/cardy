[package]
name = "release_publisher_board"
version = "0.1.0"
description = "Local-first Tauri desktop app for Jira/Slack card-news publishing"
authors = ["yunsu-in"]
edition = "2021"

[lib]
name = "release_publisher_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
